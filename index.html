  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          },
          boxShadow: {
            'anti-gravity': '0 20px 50px -12px rgba(37, 99, 235, 0.08), 0 8px 24px -8px rgba(15, 23, 42, 0.04)',
            'anti-gravity-hover': '0 30px 65px -12px rgba(37, 99, 235, 0.16), 0 12px 30px -8px rgba(15, 23, 42, 0.06)',
            'anti-gravity-lg': '0 35px 80px -15px rgba(37, 99, 235, 0.14), 0 15px 35px -10px rgba(15, 23, 42, 0.06)',
            'glow-blue': '0 0 30px rgba(37, 99, 235, 0.3)',
            'glow-emerald': '0 0 25px rgba(16, 185, 129, 0.25)',
          }
        }
      }
    }
  </script>

  <!-- Non-blocking Defer Script Loading for Chart.js, HTML2PDF, and Cropper.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js" defer></script>

  <style>
    html {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      scroll-behavior: smooth;
    }
    body {
      background: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #f8fafc 50%, #eff6ff 100%);
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .glass-card-dark {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .anti-gravity-card {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .anti-gravity-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 65px -12px rgba(37, 99, 235, 0.16), 0 12px 30px -8px rgba(15, 23, 42, 0.06);
    }
    .nav-item-lift {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-item-lift:hover {
      transform: translateY(-2px);
    }
    .nav-sticky-footer {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .admin-sticky-footer {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* Mobile scrollbar styling for wide tables & modal contents */
    .custom-scrollbar::-webkit-scrollbar {
      height: 5px;
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.6);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes nameGradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
    @keyframes nameFloatMove {
      0%, 100% {
        transform: translateY(0px) translateX(0px);
      }
      50% {
        transform: translateY(-2.5px) translateX(1.5px);
      }
    }
    .animated-student-name {
      background: linear-gradient(135deg, #1d4ed8, #2563eb, #3b82f6, #60a5fa, #4f46e5, #1e40af, #2563eb);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      animation: nameGradientShift 3.5s ease infinite, nameFloatMove 5s ease-in-out infinite;
      display: inline-block;
      font-weight: 900;
      will-change: transform, background-position;
    }
  </style>
</head>
<body class="min-h-full text-slate-800 antialiased overflow-x-hidden">



  <!-- Main Root Container for Dynamic JS Rendering -->
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Toast Notification System -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none max-w-sm w-full px-4"></div>

  <!-- Application Logic (Loaded with defer for fast DOM parsing) -->
  <script src="app.js" defer></script>

  <!-- PWA Custom Install Banner -->
  <div id="pwaInstallBanner" class="hidden fixed bottom-20 left-4 right-4 sm:left-auto sm:right-6 sm:max-w-sm z-50 p-4 rounded-3xl glass-card border border-white/80 shadow-2xl transition-all duration-500">
    <div class="flex items-start justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-slate-900 to-brand-900 p-1 flex items-center justify-center shadow-md shadow-brand-500/20 flex-shrink-0 border border-brand-400/30">
          <img src="icons/icon-192.png" alt="M Logo" class="w-full h-full object-contain rounded-xl" />
        </div>
        <div>
          <h4 class="text-xs font-black text-slate-900">Install MANSHAU App</h4>
          <p class="text-[11px] text-slate-500 font-medium leading-tight">Add to Home Screen for fast offline access</p>
        </div>
      </div>
      <button id="pwaCloseBtn" onclick="dismissPwaBanner()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="mt-3 flex gap-2">
      <button id="pwaInstallBtn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-extrabold py-2.5 px-3 rounded-xl text-xs shadow-md shadow-brand-500/20 transition-all hover:scale-[1.02] flex items-center justify-center space-x-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" y2="3"/></svg>
        <span>Install App</span>
      </button>
    </div>
  </div>

  <!-- PWA Update Available Banner -->
  <div id="pwaUpdateBanner" class="hidden fixed top-5 left-4 right-4 sm:left-auto sm:right-6 sm:max-w-sm z-50 p-4 rounded-2xl glass-card border border-brand-300 shadow-2xl bg-white/95 backdrop-blur-md transition-all duration-500">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center space-x-3 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold flex-shrink-0 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </div>
        <div class="min-w-0">
          <h4 class="text-xs font-black text-slate-900 truncate">New update available!</h4>
          <p class="text-[11px] text-slate-500 font-medium leading-tight truncate">Click Reload to get new content</p>
        </div>
      </div>
      <button id="pwaReloadBtn" class="flex-shrink-0 bg-brand-600 hover:bg-brand-700 text-white font-extrabold px-3.5 py-1.5 rounded-xl text-xs shadow-sm transition-all hover:scale-105">
        Reload
      </button>
    </div>
  </div>

  <!-- Service Worker & PWA Install / Update Registration -->
  <script>
    let deferredPrompt = null;
    let refreshing = false;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('[PWA] Service Worker registered successfully with scope:', registration.scope);

            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (!newWorker) return;

              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  showUpdateBanner(newWorker);
                }
              });
            });
          })
          .catch((error) => {
            console.error('[PWA] Service Worker registration failed:', error);
          });
      });
    }

    function showUpdateBanner(worker) {
      const banner = document.getElementById('pwaUpdateBanner');
      const reloadBtn = document.getElementById('pwaReloadBtn');
      if (banner) banner.classList.remove('hidden');
      if (reloadBtn) {
        reloadBtn.onclick = () => {
          worker.postMessage({ type: 'SKIP_WAITING' });
        };
      }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwaInstallBanner');
      if (banner && !sessionStorage.getItem('pwaBannerDismissed')) {
        banner.classList.remove('hidden');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const installBtn = document.getElementById('pwaInstallBtn');
      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`[PWA] Install prompt outcome: ${outcome}`);
          deferredPrompt = null;
          const banner = document.getElementById('pwaInstallBanner');
          if (banner) banner.classList.add('hidden');
        });
      }
    });

    window.addEventListener('appinstalled', () => {
      console.log('[PWA] Application installed successfully');
      deferredPrompt = null;
      const banner = document.getElementById('pwaInstallBanner');
      if (banner) banner.classList.add('hidden');
    });

    function dismissPwaBanner() {
      const banner = document.getElementById('pwaInstallBanner');
      if (banner) banner.classList.add('hidden');
      sessionStorage.setItem('pwaBannerDismissed', 'true');
    }
  </script>
</body>
</html>
