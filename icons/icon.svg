<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3" />

  <!-- Academic Crest Shield -->
  <path d="M 256,90 L 376,140 V 260 C 376,340 256,410 256,410 C 256,410 136,340 136,260 V 140 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Open Book Symbol -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M 170,290 C 210,275 245,285 256,295 C 256,295 256,210 256,210 C 245,200 210,190 170,205 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Right Page -->
    <path d="M 342,290 C 302,275 267,285 256,295 C 256,295 256,210 256,210 C 267,200 302,190 342,205 Z" fill="#e2e8f0" opacity="0.95"/>
    <!-- Spine Line -->
    <line x1="256" y1="210" x2="256" y2="298" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Graduation Cap -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond Base -->
    <polygon points="256,135 340,175 256,215 172,175" fill="#ffffff"/>
    <polygon points="256,135 340,175 256,215 172,175" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Cap Skull Cap Underneath -->
    <path d="M 205,192 V 222 C 205,238 307,238 307,222 V 192" fill="#2563eb"/>

    <!-- Tassel -->
    <path d="M 320,185 L 335,225" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="335" cy="230" r="7" fill="#fbbf24"/>
  </g>

  <!-- Center Golden Star of Excellence -->
  <polygon points="256,335 262,350 278,350 265,360 270,375 256,365 242,375 247,360 234,350 250,350" fill="url(#goldGrad)"/>
</svg>
