<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Royal Blue at top-left to Light Sky Blue at bottom-right -->
    <linearGradient id="royalToSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Elevated Soft Shadow Filter -->
    <filter id="elevatedShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e40af" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Square Container -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#royalToSkyGrad)" filter="url(#elevatedShadow)" />

  <!-- Centered Bold White Sans-Serif Letter M -->
  <text x="256" y="348" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Arial, sans-serif" 
        font-size="288" 
        font-weight="800" 
        fill="#ffffff" 
        text-anchor="middle">M</text>
</svg>
